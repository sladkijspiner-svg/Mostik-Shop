<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ваш заказ — MINIFIG STORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">MINIFIG <span style="color:#a41f1f">STORE</span></div>
    <nav class="nav-links">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a href="find.html">Найти фигурку</a>
    </nav>
    <form class="search-box" id="header-search-form">
      <input type="text" placeholder="Поиск товаров">
      <button type="submit">🔍</button>
    </form>
    <a class="cart-link" href="cart.html">🛒 <span class="cart-text">Корзина</span> <span class="cart-badge">0</span></a>
  </div>
</header>

<div class="container">
  <h1 class="section-title" style="margin-top:0">Ваш заказ</h1>
  <div id="checkout-content"><p class="loading-text">Загружаем...</p></div>
</div>

<footer class="site-footer">
  <div class="container">
    MINIFIG STORE — минифигурки Marvel, DC и другие серии. Работаем по всей России.
    &nbsp;·&nbsp;<a href="admin.html">Админ-панель</a>
  </div>
</footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
<script>
  const ORDERS_KEY = "minifig_orders_v1";

  function loadOrders() {
    try {
      return JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
    } catch (e) { return []; }
  }

  function saveOrders(orders) {
    localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
  }

  const content = document.getElementById("checkout-content");
  let items = [];

  function buildOrderMessage(order) {
    const lines = [`🧱 Хочу заказать (${order.id}):`, ""];
    order.items.forEach(i => lines.push(`- ${i.name} × ${i.qty} — ${formatPrice(i.price * i.qty)}`));
    lines.push("", `Итого: ${formatPrice(order.total)}`);
    return lines.join("\n");
  }

  function renderSummary() {
    const total = getCartTotal();
    content.innerHTML = `
      <div class="order-summary-box" style="max-width:480px">
        <h3 style="margin-top:0">Что вы выбрали</h3>
        ${items.map(i => `
          <div class="item-row">
            <span>${i.product.name} × ${i.qty}</span>
            <span>${formatPrice(i.lineTotal)}</span>
          </div>`).join("")}
        <div class="cart-summary-row total"><span>Итого</span><span>${formatPrice(total)}</span></div>
        <button class="btn btn-primary btn-block" id="send-tg-btn" style="margin-top:16px">Написать в Telegram</button>
        <p style="color:var(--text-muted); font-size:13px; margin-top:10px">
          Откроется чат с продавцом с готовым списком товаров — там же обсудите способ получения и оплату.
        </p>
      </div>
    `;

    document.getElementById("send-tg-btn").addEventListener("click", () => {
      const order = {
        id: "ORD-" + Date.now().toString().slice(-6),
        date: new Date().toISOString(),
        status: "Новый",
        items: items.map(i => ({ id: i.product.id, name: i.product.name, qty: i.qty, price: i.product.price })),
        total: total
      };

      const orders = loadOrders();
      orders.push(order);
      saveOrders(orders);
      clearCart();

      const tgLink = telegramLink(buildOrderMessage(order));
      window.open(tgLink, "_blank");
      renderSuccess(tgLink);
    });
  }

  function renderSuccess(tgLink) {
    content.innerHTML = `
      <div class="success-box">
        <div class="big-emoji">✅</div>
        <h2>Открыли Telegram</h2>
        <p>Список товаров уже вставлен в сообщение — нажмите «Отправить» в чате, и продавец с вами свяжется.</p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap">
          <a class="btn btn-primary" href="${tgLink}" target="_blank">Открыть Telegram ещё раз</a>
          <a class="btn btn-outline" href="catalog.html">Продолжить покупки</a>
        </div>
      </div>
    `;
  }

  (async () => {
    await initProducts();
    items = getCartDetailed();

    if (items.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="big-emoji">🛒</div>
          <p>Корзина пуста — сначала добавьте товары.</p>
          <a class="btn btn-primary" href="catalog.html">Перейти в каталог</a>
        </div>`;
    } else {
      renderSummary();
    }
  })();
</script>
</body>
</html>
