<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админ-панель — MINIFIG STORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">MINIFIG <span style="color:#a41f1f">STORE</span></div>
    <nav class="nav-links">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a href="find.html">Найти фигурку</a>
    </nav>
    <a class="cart-link" href="cart.html">🛒 <span class="cart-text">Корзина</span> <span class="cart-badge">0</span></a>
  </div>
</header>

<div class="container">
  <h1 class="section-title" style="margin-top:0">Админ-панель</h1>
  <div id="admin-content"></div>
</div>

<footer class="site-footer">
  <div class="container">MINIFIG STORE — панель управления</div>
</footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script>
  // Демо-защита: пароль хранится в открытом виде и подходит только для локальной демонстрации.
  const ADMIN_PASSWORD = "admin123";
  const ORDERS_KEY = "minifig_orders_v1";
  const REQUESTS_KEY = "minifig_requests_v1";
  const SESSION_KEY = "minifig_admin_session";

  function loadOrders() {
    try { return JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; } catch (e) { return []; }
  }
  function saveOrders(o) { localStorage.setItem(ORDERS_KEY, JSON.stringify(o)); }

  function loadRequests() {
    try { return JSON.parse(localStorage.getItem(REQUESTS_KEY)) || []; } catch (e) { return []; }
  }
  function saveRequests(r) { localStorage.setItem(REQUESTS_KEY, JSON.stringify(r)); }

  const content = document.getElementById("admin-content");

  function renderLogin() {
    content.innerHTML = `
      <div class="login-box">
        <h2>Вход в админ-панель</h2>
        <div class="form-group">
          <input type="password" id="admin-pass" placeholder="Пароль">
        </div>
        <button class="btn btn-primary btn-block" id="login-btn">Войти</button>
        <p style="color:var(--text-muted); font-size:12px; margin-top:16px">Демо-пароль: admin123</p>
      </div>
    `;
    document.getElementById("login-btn").addEventListener("click", () => {
      const val = document.getElementById("admin-pass").value;
      if (val === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "1");
        renderDashboard();
      } else {
        alert("Неверный пароль");
      }
    });
  }

  let activeTab = "products";

  function renderDashboard() {
    content.innerHTML = `
      <div class="admin-tabs">
        <div class="admin-tab" data-tab="products">Товары</div>
        <div class="admin-tab" data-tab="orders">Заказы</div>
        <div class="admin-tab" data-tab="requests">Запросы на поиск</div>
      </div>
      <div id="tab-content"></div>
    `;
    document.querySelectorAll(".admin-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        activeTab = tab.dataset.tab;
        renderTabs();
      });
    });
    renderTabs();
  }

  function renderTabs() {
    document.querySelectorAll(".admin-tab").forEach(t => {
      t.classList.toggle("active", t.dataset.tab === activeTab);
    });
    if (activeTab === "products") renderProductsTab();
    else if (activeTab === "orders") renderOrdersTab();
    else renderRequestsTab();
  }

  async function renderProductsTab() {
    const tabContent = document.getElementById("tab-content");
    tabContent.innerHTML = `<p style="color:var(--text-muted)">Загрузка...</p>`;

    await initProducts();
    const products = loadProducts();

    const rows = products.map(p => `
      <tr data-id="${p.id}">
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${getCategory(p.category).title}</td>
        <td>${formatPrice(p.price)}</td>
        <td>${p.stock}</td>
      </tr>
    `).join("");

    tabContent.innerHTML = `
      <div class="admin-panel">
        Товарами (добавление, удаление, изменение цены и остатка) управляет Telegram-бот —
        см. команды <code>/add</code>, <code>/remove</code>, <code>/price</code>, <code>/stock</code>, <code>/list</code>.
        Здесь показан текущий каталог для справки.
        <div style="margin-top:12px">
          <button class="btn btn-outline btn-small" id="refresh-products-btn">Обновить список</button>
        </div>
      </div>
      <div class="table-scroll">
        <table class="admin-table">
          <thead><tr><th>Id</th><th>Название</th><th>Категория</th><th>Цена</th><th>Остаток</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;

    document.getElementById("refresh-products-btn").addEventListener("click", renderProductsTab);
  }

  function renderOrdersTab() {
    const orders = loadOrders().slice().reverse();
    const tabContent = document.getElementById("tab-content");

    if (orders.length === 0) {
      tabContent.innerHTML = `<div class="empty-state"><div class="big-emoji">📭</div><p>Заказов пока нет.</p></div>`;
      return;
    }

    const statuses = ["Новый", "В обработке", "Отправлен", "Завершён", "Отменён"];

    tabContent.innerHTML = `
      <p style="color:var(--text-muted); font-size:13px">
        Это список того, что люди выбрали перед тем, как написать вам в Telegram — контакты и детали смотрите там, в переписке.
      </p>
      <div class="table-scroll">
        <table class="admin-table">
          <thead><tr><th>№</th><th>Дата</th><th>Товары</th><th>Сумма</th><th>Статус</th></tr></thead>
          <tbody>
            ${orders.map(o => `
              <tr data-id="${o.id}">
                <td>${o.id}</td>
                <td>${new Date(o.date).toLocaleString("ru-RU")}</td>
                <td>${o.items.map(i => i.name + " ×" + i.qty).join("<br>")}</td>
                <td>${formatPrice(o.total)}</td>
                <td>
                  <select class="status-select">
                    ${statuses.map(s => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    tabContent.querySelectorAll("tr[data-id]").forEach(row => {
      row.querySelector(".status-select").addEventListener("change", e => {
        const orders = loadOrders();
        const order = orders.find(o => o.id === row.dataset.id);
        order.status = e.target.value;
        saveOrders(orders);
      });
    });
  }

  function renderRequestsTab() {
    const requests = loadRequests().slice().reverse();
    const tabContent = document.getElementById("tab-content");

    if (requests.length === 0) {
      tabContent.innerHTML = `<div class="empty-state"><div class="big-emoji">🔍</div><p>Запросов на поиск пока нет.</p></div>`;
      return;
    }

    const statuses = ["Новый", "В поиске", "Найдено", "Не найдено"];

    tabContent.innerHTML = `
      <div class="table-scroll">
        <table class="admin-table">
          <thead><tr><th>№</th><th>Дата</th><th>Имя</th><th>Связь</th><th>Что ищет</th><th>Статус</th></tr></thead>
          <tbody>
            ${requests.map(r => `
              <tr data-id="${r.id}">
                <td>${r.id}</td>
                <td>${new Date(r.date).toLocaleString("ru-RU")}</td>
                <td>${r.name}</td>
                <td>${r.contact}</td>
                <td>${r.description}</td>
                <td>
                  <select class="req-status-select">
                    ${statuses.map(s => `<option value="${s}" ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    tabContent.querySelectorAll("tr[data-id]").forEach(row => {
      row.querySelector(".req-status-select").addEventListener("change", e => {
        const requests = loadRequests();
        const req = requests.find(r => r.id === row.dataset.id);
        req.status = e.target.value;
        saveRequests(requests);
      });
    });
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    renderDashboard();
  } else {
    renderLogin();
  }
</script>
</body>
</html>
